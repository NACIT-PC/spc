name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # ponytail: editable install — backend/ is dependency pins, not a package
      - run: pip install -e ./backend
      - run: cd backend && python manage.py check && python manage.py test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: |
          for f in frontend/api.js frontend/app.js frontend/auth.js frontend/admin.js; do
            node --check "$f"
          done

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t spc-api:ci ./backend
      - run: docker compose config --quiet
      - run: >
          docker run -d --name spc-ci -p 8000:8000
          -e DJANGO_API_KEY=ci-dummy-key-0123456789abcdef
          -e DJANGO_DEBUG=False
          spc-api:ci
      - run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ && break
            sleep 4
          done
          curl -sf http://localhost:8000/api/health/
          test "$(curl -s 'http://localhost:8000/api/providers/' | python3 -c "import sys,json; print(json.load(sys.stdin)['count'])")" = "6"
          test "$(curl -s http://localhost:8000/api/categories/ | python3 -c "import sys,json; print(len(json.load(sys.stdin)['results']))")" = "6"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/providers/ -H 'Content-Type: application/json' -d '{"name":"x"}')" = "401"
      - if: always()
        run: docker rm -f spc-ci

  # deploy:
  #   needs: [backend, frontend, docker]
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
  # Enable by uncommenting + adding RENDER_DEPLOY_HOOK in
  # repo Settings > Secrets and variables > Actions (Render dashboard >
  # service Settings > Deploy Hook). Frontend ships separately on Vercel.
