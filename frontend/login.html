<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Service Provider Catalogue</title>
  <meta name="description" content="Sign in or create an account to list your business.">
  <link rel="icon" type="image/svg+xml" href="assets/service_provider_logo.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="api.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="wrap auth-page">
    <div class="auth-card">
      <a class="brand" href="./">
        <img class="brand__logo" src="assets/service_provider_logo.svg" alt="" width="44" height="44">
        <span>Service Provider Catalogue</span>
      </a>
      <h1>Sign in</h1>
      <p class="state__text">Signed-in users can list a business. Passwords need 8+ characters.</p>
      <form id="auth-form" class="form-grid">
        <label class="form-grid__full">Username<input id="auth-user" type="text" autocomplete="username" maxlength="150"></label>
        <label class="form-grid__full">Password<input id="auth-pass" type="password" autocomplete="current-password" maxlength="128"></label>
      </form>
      <p id="auth-status" role="status"></p>
      <div class="details__actions">
        <a class="btn btn--quiet" href="./">Back to catalogue</a>
        <button id="register-btn" class="btn btn--quiet" type="button">Create account</button>
        <button id="login-btn" class="btn btn--brand" type="button">Log in</button>
      </div>
    </div>
  </main>
</body>
</html>
